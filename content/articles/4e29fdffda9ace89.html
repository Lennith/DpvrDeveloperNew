<span id="server-lib"></span><h1>基于RDC库的服务端开发<a class="headerlink" href="#rdc" title="Link to this heading">¶</a></h1>
<p>我们提供了一套基于RDC通信协议中的Demo，进行了一层封装的RDC <a class="reference external" href="https://static.dpvr.com/apps/developer/rdc/v2/resources/LibDpvrRDC.zip">.Net7.0 Win64 C#库</a> ，供开发者更快的进行开发RDC功能开发。</p>
<p>如果你的系统中没有.Net 7.0,可以选择下载包含了.Net7.0 Runtime的 <a class="reference external" href="https://static.dpvr.com/apps/developer/rdc/v2/resources/RDCLibWithDotNet7Runtime.zip">LibDpvrRDC</a>。</p>
<p>接口使用参考 <a class="reference external" href="https://static.dpvr.com/apps/developer/rdc/v2/resources/RDCLibTest.zip">Demo</a> 。</p>
<p><cite>需要使用Namespace DPVR，接口类名 DpvrRDCServer。</cite></p>
